<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Isaiah Ramirez — an interactive liquid-glass data constellation." />
  <title>Isaiah Ramirez · Liquid Data Core</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/dashersw/liquid-glass-js@main/styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/dashersw/liquid-glass-js@main/glass.css" />
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;--cyan:#8af3ff;--violet:#af99ff;--ink:#061320}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 23% 35%,#17516c 0,transparent 27%),radial-gradient(circle at 80% 70%,#31245f 0,transparent 30%),linear-gradient(135deg,#06111e,#071f30 52%,#100c28);color:#eafcff}
    body:before{content:"";position:fixed;inset:0;opacity:.18;background-image:linear-gradient(rgba(150,235,255,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(150,235,255,.15) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(circle,#000,transparent 75%)}
    main{position:relative;min-height:100vh;display:grid;place-items:center;padding:32px}.scene{position:relative;width:min(900px,94vw);height:min(570px,78vh)}
    .copy{position:absolute;left:50%;top:50%;transform:translate(-2%,-50%);z-index:4;width:min(470px,52vw)}.eyebrow{font:600 12px ui-monospace,SFMono-Regular,monospace;letter-spacing:.2em;color:var(--cyan)}h1{font-size:clamp(38px,6vw,78px);line-height:.92;letter-spacing:-.055em;margin:22px 0 20px}p{max-width:42ch;color:#afc8d6;line-height:1.6}.back{display:inline-block;margin-top:20px;color:#ddfaff;text-underline-offset:5px}
    .nodes{position:absolute;inset:0;z-index:6;pointer-events:none}.node{position:absolute;left:25%;top:50%;width:var(--size);height:var(--size);margin:calc(var(--size)/-2);border-radius:50%;display:grid;place-items:center;color:white;font-weight:750;letter-spacing:-.06em;background:radial-gradient(circle at 28% 18%,rgba(255,255,255,.75),rgba(102,223,255,.18) 37%,rgba(143,104,255,.24));border:1px solid rgba(220,250,255,.54);box-shadow:0 18px 60px rgba(50,203,255,.2),inset 0 1px 5px rgba(255,255,255,.7);backdrop-filter:blur(9px);animation:scatter 7s cubic-bezier(.7,0,.25,1) infinite;animation-delay:var(--delay)}
    .node:after{content:"";position:absolute;inset:8%;border-radius:50%;border-top:2px solid rgba(255,255,255,.75);transform:rotate(-35deg)}
    .core{--size:138px;font-size:42px;z-index:2}.sat{font-size:0;opacity:0;--size:var(--s)}
    .n1{--x:-145px;--y:-118px;--s:45px;--delay:-.12s}.n2{--x:-30px;--y:-185px;--s:34px;--delay:-.2s}.n3{--x:120px;--y:-120px;--s:54px;--delay:-.34s}.n4{--x:172px;--y:10px;--s:38px;--delay:-.08s}.n5{--x:108px;--y:142px;--s:47px;--delay:-.27s}.n6{--x:-42px;--y:170px;--s:31px;--delay:-.16s}.n7{--x:-160px;--y:98px;--s:42px;--delay:-.3s}
    .credit{position:fixed;left:20px;bottom:16px;color:#66879b;font-size:11px;z-index:10}.credit a{color:#86b9ce}
    @keyframes scatter{0%,15%,88%,100%{transform:translate(0,0) scale(.2);opacity:0}27%,72%{transform:translate(var(--x,0),var(--y,0)) scale(1);opacity:1}}.core{animation-name:corePulse}.core .label{animation:labelPulse 7s ease-in-out infinite}@keyframes corePulse{0%,15%,88%,100%{transform:scale(1);opacity:1}38%,66%{transform:scale(.5);opacity:.26}}@keyframes labelPulse{0%,22%,82%,100%{opacity:1}35%,68%{opacity:0}}
    @media(max-width:700px){.scene{height:78vh}.nodes{transform:translate(-5%,-23%) scale(.72)}.copy{left:8%;top:67%;transform:none;width:84vw;text-align:center}.copy p{margin-inline:auto}h1{margin-block:14px}.eyebrow{font-size:10px}.credit{right:12px;text-align:center}}
    @media(prefers-reduced-motion:reduce){.node{animation:none}.sat{display:none}.core{opacity:1;transform:none}}
  </style>
</head>
<body>
  <main>
    <section class="scene" aria-label="A liquid data core separates into connected ideas and reforms">
      <div class="nodes" aria-hidden="true">
        <div class="node core"><span class="label">IR</span></div><div class="node sat n1"></div><div class="node sat n2"></div><div class="node sat n3"></div><div class="node sat n4"></div><div class="node sat n5"></div><div class="node sat n6"></div><div class="node sat n7"></div>
      </div>
      <div class="copy"><div class="eyebrow">DATA · SYSTEMS · PEOPLE</div><h1>Ideas become<br />useful systems.</h1><p>I’m Isaiah Ramirez. I build data platforms, human-centered AI, and interactive software in Ann Arbor, Michigan.</p><a class="back" href="../">Explore my work →</a></div>
    </section>
  </main>
  <div class="credit">Glass rendering via <a href="https://github.com/dashersw/liquid-glass-js">liquid-glass-js</a> · MIT</div>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/dashersw/liquid-glass-js@main/container.js"></script>
  <script>
    window.addEventListener('load',()=>{if(!window.Container||matchMedia('(prefers-reduced-motion: reduce)').matches)return;document.querySelectorAll('.node').forEach((node)=>{try{const glass=new Container({type:'circle',tintOpacity:.18});glass.element.style.cssText='position:absolute;inset:0;pointer-events:none;opacity:.38';node.appendChild(glass.element)}catch(error){console.info('Using the CSS glass fallback.',error)}})})
  </script>
</body>
</html>
